<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>OpsLab X – Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#012670;--or:#E59744;--bg:#F7F8FA;--card:#fff;--tx:#14213d;--mu:#6b7385;--bd:#e6e9ef;--ok:#168a4a;--okb:#e5f6ec;--wa:#a86400;--wab:#fff3dc;--er:#c62f2f;--erb:#fde8e8;--nb:#e8edfa;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1320;--card:#181d2e;--tx:#eef0f6;--mu:#9aa3b8;--bd:#2a3148;--nb:#232b47;--okb:#143323;--wab:#3a2c10;--erb:#3c1a1a;--navy:#5b82e6;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{font:15px/1.45 Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;height:100%}
aside{width:236px;background:var(--card);border-right:1px solid var(--bd);padding:18px 14px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.logo{width:150px;margin:0 0 14px 6px;display:block}
.nav{display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:10px;border:0;background:none;width:100%;text-align:left;cursor:pointer;color:var(--mu);font-weight:500;position:relative}
.nav:hover{background:var(--bg)}.nav.on{background:var(--nb);color:var(--navy);font-weight:600}.nav.on:before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--or)}
.nav .t{margin-left:auto;font-size:10px;background:var(--wab);color:var(--wa);padding:2px 7px;border-radius:99px;font-weight:600}
main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;gap:12px;align-items:center;padding:12px 28px;background:var(--card);border-bottom:1px solid var(--bd)}
.top input{flex:1;max-width:420px;padding:10px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.ic{width:40px;height:40px;border-radius:10px;border:1px solid var(--bd);background:var(--card);cursor:pointer;position:relative}
.dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--or)}
.av{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px;flex:none}
#view{flex:1;overflow:auto;padding:26px 28px 40px}
h1{font-size:24px;margin:0 0 4px;color:var(--navy)}h2{font-size:16px;margin:0 0 12px}.sub{color:var(--mu);margin:0 0 20px}
.hd{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin-bottom:6px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer;min-height:42px}
.btn:hover{filter:brightness(1.15)}.btn.o{background:var(--card);color:var(--navy);border:1px solid var(--bd)}.btn.or{background:var(--or);color:#1c1200}.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:2fr 1fr}.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;box-shadow:0 1px 2px rgba(1,38,112,.04)}
.kpi b{display:block;font-size:26px;margin-top:4px;color:var(--navy)}.kpi small{color:var(--mu)}.kpi i{font-style:normal;font-size:12px;color:var(--ok);font-weight:600}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;color:var(--mu);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--bd)}td{padding:12px 10px;border-bottom:1px solid var(--bd)}tr.c{cursor:pointer}tr.c:hover td{background:var(--bg)}
.b{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--nb);color:var(--navy);white-space:nowrap}
.b.ok{background:var(--okb);color:var(--ok)}.b.wa{background:var(--wab);color:var(--wa)}.b.er{background:var(--erb);color:var(--er)}
.bar{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}.bar input,.bar select,.f input,.f select,.f textarea{padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);min-height:42px;width:100%}.bar input{flex:1;min-width:180px;width:auto}.bar select{width:auto}
.chip{padding:6px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:13px}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.row{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}.row .g{flex:1;min-width:0}.row small{color:var(--mu);display:block}
.chart{display:flex;align-items:flex-end;gap:12px;height:170px;padding-top:10px}.chart div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.chart span{display:block;background:var(--navy);border-radius:6px 6px 0 0;margin-bottom:4px;opacity:.85}.chart div:last-child span{background:var(--or)}
.inbox{display:grid;grid-template-columns:290px 1fr 270px;gap:0;height:calc(100vh - 190px);min-height:460px;padding:0;overflow:hidden}.inbox>div{overflow:auto;padding:14px}.inbox>div+div{border-left:1px solid var(--bd)}
.cv{display:flex;gap:10px;padding:10px;border-radius:10px;cursor:pointer;align-items:center}.cv:hover,.cv.on{background:var(--nb)}.cv .g{flex:1;min-width:0}.cv small{color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.un{background:var(--or);color:#1c1200;border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px}
.m{max-width:75%;padding:9px 13px;border-radius:14px;margin:6px 0;background:var(--bg)}.m.me{background:var(--navy);color:#fff;margin-left:auto}
.note{background:var(--wab);color:var(--wa);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.mask{position:fixed;inset:0;background:rgba(1,20,60,.45);display:grid;place-items:center;padding:16px;z-index:50}.modal{background:var(--card);border-radius:16px;padding:22px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
.f label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:12px 20px;border-radius:12px;z-index:60;font-weight:500}
.empty{text-align:center;padding:30px;color:var(--mu)}
.steps{display:flex;gap:6px;margin:12px 0}.steps i{flex:1;height:6px;border-radius:4px;background:var(--bd)}.steps i.d{background:var(--or)}
.pimg{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:22px;background:var(--nb);flex:none}
nav.bot{display:none}.mob{display:none}
@media(max-width:860px){aside{display:none}.top{padding:10px 14px}#view{padding:18px 14px 90px}.g2{grid-template-columns:1fr}.mob{display:block}.dk{display:none}
nav.bot{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:40}
nav.bot button{flex:1;border:0;background:none;color:var(--mu);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer}nav.bot button.on{color:var(--navy);font-weight:700}nav.bot span{font-size:20px}
.inbox{grid-template-columns:1fr;height:auto}.inbox .ci,.inbox .info{display:none}.inbox.open .cl{display:none}.inbox.open .ci{display:block}.toast{bottom:90px}.top input{min-width:0}}
.kb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}.kc{background:var(--nb);border-radius:14px;padding:10px;min-height:120px}.kc h3{margin:4px 6px 10px;font-size:13px;display:flex;justify-content:space-between;align-items:center;color:var(--navy)}.kc h3 span{background:var(--card);border-radius:99px;padding:1px 9px;font-size:12px}
.dc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}.rt{margin:10px 0;font-size:13px;display:grid;gap:6px}.rt div{display:flex;gap:8px;align-items:flex-start}.rt i{width:10px;height:10px;border-radius:50%;border:3px solid var(--navy);margin-top:4px;flex:none}.rt i.d{border-color:var(--or)}.rt small{color:var(--mu);display:block}
.sim{border:1px dashed var(--or);border-radius:10px;padding:8px;margin:8px 0;font-size:12px;color:var(--mu)}.sim div{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.kc .empty{padding:18px 6px;font-size:13px}.dv{display:flex;gap:12px;overflow:auto;padding-bottom:4px}.dv .card{min-width:230px;padding:14px}
@media(max-width:1180px){.kb{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.kb{grid-template-columns:1fr}}
.pc{display:flex;flex-direction:column;gap:12px}.pc .top{display:flex;gap:12px;align-items:center}.pc .top .g{flex:1;min-width:0}.pc .top small{color:var(--mu);display:block}.pc .nums{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}.lb{display:block;color:var(--mu);font-size:12px}.pc .acts{display:flex;gap:8px;margin-top:auto}.pc .acts .btn{flex:1}
.pl,.ph{display:grid;grid-template-columns:44px minmax(150px,1fr) 110px 90px 100px 190px;gap:14px;align-items:center;padding:12px}.pl{border-bottom:1px solid var(--bd)}.pl:last-child{border:0}.pl small{color:var(--mu);display:block}.pl .lb{display:none}.ph{font-size:12px;color:var(--mu);font-weight:600;border-bottom:1px solid var(--bd);padding-top:8px;padding-bottom:8px}.pl .acts{display:flex;gap:8px;justify-content:flex-end}
@media(max-width:700px){.ph{display:none}.pl{grid-template-columns:44px 1fr auto;grid-template-areas:"i n s" "i p q" "a a a"}.pl .i{grid-area:i}.pl .n{grid-area:n}.pl .s{grid-area:s}.pl .pr{grid-area:p}.pl .q{grid-area:q}.pl .acts{grid-area:a}.pl .acts .btn{flex:1}.pl .lb{display:block}}
</style></head><body>

function saveP(s){const v=[pn.value,ps.value,+pp.value,+pq.value,"📦"];if(!v[0])return;const i=P.findIndex(x=>x[1]==s);if(i>=0){v[4]=P[i][4];P[i]=v}else P.push(v);X();render();toast("Product saved!")}
function stock(s){const p=P.find(x=>x[1]==s);modal(`<div class="f"><h2>Update stock</h2><p>${p[0]} – ${p[3]} in stock</p><label>New quantity</label><input id="sq" type="number" value="${p[3]}"><button class="btn" style="width:100%;margin-top:16px" onclick="P.find(x=>x[1]=='${s}')[3]=+sq.value;X();render();toast('Stock updated!')">Update</button></div>`)}
function recPay(){modal(`<div class="f"><h2>Record a payment</h2><label>Order</label><select>${O.filter(o=>o[4]=="Pending").map(o=>`<option>${o[0]} – ${o[1]}</option>`).join("")}</select><label>Method</label><select><option>Bank transfer</option><option>Cash</option><option>POS</option></select><label>Reference</label><input placeholder="e.g. transfer ref"><button class="btn" style="width:100%;margin-top:16px" onclick="X();toast('Payment recorded. Great work!')">Record payment</button></div>`)}
function sendM(){if(!mi.value)return;(M[ch]=M[ch]||[]).push(mi.value);if(M[ch].length%2==0)M[ch].push("");M[ch]=M[ch].filter(x=>x);render()}
q.oninput=()=>{if(q.value){ofl=q.value;if(cur!="orders")go("orders");else ol()}};
const DS=[["Kunle A.","0802 555 0111",["Ikeja","Maryland","Ojota"],"Motorbike",4.8,214,1500,"Available"],["Femi O.","0805 555 0122",["Lekki","Ajah","Victoria Island"],"Motorbike",4.6,163,2500,"Available"],["Bola S.","0807 555 0133",["Yaba","Surulere","Ikeja"],"Van",4.9,301,2000,"Available"],["Tosin R.","0813 555 0144",["Lekki","Ajah"],"Motorbike",4.7,98,2300,"Busy"]];
const DL={"#1042":["14 Allen Avenue, Ikeja","Ikeja"],"#1041":["Admiralty Way, Lekki Phase 1","Lekki"],"#1040":["22 Bode Thomas St, Surulere","Surulere"],"#1039":["Herbert Macaulay Way, Yaba","Yaba"],"#1038":["Yaba Tech Road, Yaba","Yaba"]};const PK="Sarah's Closet, 5 Opebi Road, Ikeja";
let AS=[{id:"DA-101",o:"#1039",d:"Bola S.",t:"Primary",s:"Picked up",log:[["Request sent","09:10"],["Accepted by dispatcher","09:14"],["Picked up","09:40"]]}],dtab="need",dn=102;
const ts=()=>new Date().toTimeString().slice(0,5),act=o=>AS.filter(a=>a.o==o&&["Requested","Accepted","Picked up"].includes(a.s)),prim=o=>act(o).find(a=>a.t!="Secondary"),lg=(a,t)=>a.log.push([t,ts()]);
function assign(id,t="Primary"){const l=DL[id]||["Address to be confirmed","Ikeja"];const bz=act(id).map(a=>a.d);const m=DS.filter(d=>d[2].includes(l[1])&&!bz.includes(d[0]));
modal(`<div class="hd"><h2>${t=="Primary"?"Assign dispatcher":t=="Secondary"?"Add secondary dispatcher":"Replace dispatcher"} · ${id}</h2><button class="btn o sm" onclick="X()">Close</button></div><div class="row"><div class="g"><small>Pickup</small>${PK}</div></div><div class="row"><div class="g"><small>Deliver to</small>${l[0]}</div></div><p class="sub" style="margin:12px 0 4px">${m.length} dispatcher(s) operate in <b>${l[1]}</b>:</p>${m.map(d=>`<div class="row"><div class="av">${ini(d[0])}</div><div class="g"><b>${d[0]}</b><small>${d[3]} · ★${d[4]} · ${d[5]} deliveries</small><small>Covers ${d[2].join(", ")}</small></div>${bd(d[7])}<button class="btn o sm" onclick="rv('${id}','${d[0]}','${t}')">Review</button></div>`).join("")||'<div class="empty">No dispatcher covers this area yet.</div>'}`)}
function rv(id,n,t){const d=DS.find(x=>x[0]==n);modal(`<h2>${d[0]}</h2><div class="row"><div class="g"><small>Phone</small>${d[1]}</div><div class="g"><small>Vehicle</small>${d[3]}</div></div><div class="row"><div class="g"><small>Rating</small>★${d[4]}</div><div class="g"><small>Completed</small>${d[5]}</div></div><div class="row"><div class="g"><small>Operating areas</small>${d[2].join(", ")}</div></div><div class="row"><div class="g"><small>Delivery fee (sample)</small>${NG(d[6])}</div>${bd(d[7])}</div><p class="sub" style="margin-top:10px">${d[0]} gets a request for ${id} and has 15 minutes to accept or decline.${t=="Replacement"?" Your current dispatcher assignment will be cancelled.":""}</p><div style="display:flex;gap:8px"><button class="btn o" onclick="assign('${id}','${t}')">Back</button><button class="btn" style="flex:1" ${d[7]=="Busy"?"disabled":""} onclick="send('${id}','${n}','${t}')">${d[7]=="Busy"?"Currently busy":"Send delivery request"}</button></div>`)}
function send(id,n,t){const p=prim(id);if(t=="Primary"&&p){X();return toast("This order already has an active dispatcher. Use Replace or Add secondary.")}
if(t=="Replacement"&&p){if(p.s=="Picked up"){X();return toast("Already picked up, so it can't be replaced.")}p.s="Cancelled";lg(p,"Replaced by "+n)}
AS.push({id:"DA-"+dn++,o:id,d:n,t,s:"Requested",log:[["Request sent (expires in 15 min)",ts()]]});X();dtab="asg";go("del");toast(`Request sent to ${n}. Push alert is simulated until notifications are connected.`)}
function resp(i,r){const a=AS.find(x=>x.id==i);a.s=r;lg(a,r=="Accepted"?"Accepted by dispatcher":r=="Declined"?"Declined by dispatcher":"Expired, no response in 15 min");render();toast(r=="Accepted"?`${a.d} accepted ${a.o}.`:`${a.o} is back in Needs dispatcher.`)}
function pick(i){const a=AS.find(x=>x.id==i);a.s="Picked up";lg(a,"Picked up");O.find(x=>x[0]==a.o)[5]="Dispatched";render();toast(a.o+" is now Dispatched")}
function deliver(i){const a=AS.find(x=>x.id==i);a.s="Delivered";lg(a,"Delivered");O.find(x=>x[0]==a.o)[5]="Delivered";render();toast("Delivered! Customer message will send once SMS is connected.")}
function cancelA(i){const a=AS.find(x=>x.id==i);modal(`<h2>Cancel ${a.id}?</h2><p>${a.s=="Requested"?"Dispatcher hasn't responded yet, so the request is simply withdrawn.":"The dispatcher already accepted. You can cancel until pickup, and they will be told."}</p><p class="sub">The order returns to Needs dispatcher. Once picked up, an assignment can't be cancelled.</p><div style="display:flex;gap:8px"><button class="btn o" onclick="X()">Keep it</button><button class="btn" style="flex:1;background:var(--er)" onclick="c2('${i}')">Cancel assignment</button></div>`)}
function c2(i){const a=AS.find(x=>x.id==i);a.s="Cancelled";lg(a,"Cancelled by owner");X();render();toast("Assignment cancelled.")}
function hist(i){const a=AS.find(x=>x.id==i);modal(`<div class="hd"><h2>${a.id} history</h2><button class="btn o sm" onclick="X()">Close</button></div>${a.log.map(l=>`<div class="row"><div class="g">${l[0]}</div><small>${l[1]}</small></div>`).join("")}`)}
function trk(i){modal(`<h2>Customer tracking link</h2><p class="sub">Sample link, no account needed. Live tracking is not active yet.</p><input readonly value="opslabx.app/track/a8f3k2" style="width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px"><button class="btn" style="margin-top:12px" onclick="X();toast('Link copied (sample)')">Copy link</button>`)}
function acts(i){const a=AS.find(x=>x.id==i);modal(`<div class="hd"><h2>${a.o} · ${a.d}</h2><button class="btn o sm" onclick="X()">Close</button></div>${a.t!="Secondary"?`<button class="btn o" style="width:100%;margin-bottom:8px" onclick="assign('${a.o}','Replacement')">Replace dispatcher</button>`:""}<button class="btn o" style="width:100%;margin:8px 0" onclick="assign('${a.o}','Secondary')">Add a secondary dispatcher</button><button class="btn o" style="width:100%;margin-bottom:8px" onclick="hist('${a.id}')">View history</button><button class="btn" style="width:100%;background:var(--er)" onclick="cancelA('${a.id}')">Cancel assignment</button>`)}
function render(){shell();view.innerHTML=V[cur]();view.scrollTop=0}
render();
</script></body></html>
